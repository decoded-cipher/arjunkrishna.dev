name: Deploy

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [ghost-publish]
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://decoded-cipher.github.io
          BASE_PATH: /arjunkrishna.dev
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          urls=$(curl -fsSL "${{ needs.deploy.outputs.url }}sitemap.xml" | grep -o '<loc>[^<]*' | cut -c6- | jq -R . | jq -sc .)
          jq -nc --arg site "${{ needs.deploy.outputs.url }}" --arg key "$KEY" --argjson urls "$urls" \
            '{host: ($site | split("/")[2]), key: $key, keyLocation: "\($site)\($key).txt", urlList: $urls}' |
            curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @-
        env:
          KEY: 6d8419d8151fdcf2c7b861e9d94445ee
